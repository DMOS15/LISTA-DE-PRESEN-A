<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Assinar presença</title>
<style>
:root{--flat:#fcf9f4;--crema:#f7eedc;--latte:#d3ba91;--mocha:#8c7454;--doppio:#3f3a31;--err:#a04830;--ok:#2f6b3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--flat);color:var(--doppio);font:17px/1.45 Arial,Helvetica,sans-serif}
h1,h2,.num{font-family:"TW Cen MT Condensed","Tw Cen MT Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;font-weight:700}
header{background:var(--crema);border-bottom:3px solid var(--latte);padding:10px 16px;display:flex;align-items:center;gap:14px}
header img{height:36px}
header h1{margin:0;font-size:22px;letter-spacing:.03em}
main{max-width:720px;margin:0 auto;padding:16px}
.info{background:var(--crema);border:1px solid var(--latte);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.info b{display:block;font-size:20px}
.info span{font-size:14px}
.prog{height:8px;background:var(--latte);border-radius:99px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--doppio);width:0;transition:width .3s}
input[type=search],input[type=text]{width:100%;padding:14px;border:1px solid var(--mocha);border-radius:8px;font:inherit;background:#fff;margin-bottom:12px}
input:focus,button:focus-visible{outline:3px solid var(--mocha);outline-offset:1px}
.nomes{display:grid;gap:10px}
.nome{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;font-weight:700;font-size:18px;padding:16px;min-height:60px;border:2px solid var(--doppio);border-radius:10px;background:var(--flat);color:var(--doppio);cursor:pointer}
.nome:active{background:var(--latte)}
.nome.feito{border-color:var(--latte);background:var(--crema);color:#7a7260;cursor:default}
.nome .ck{font-weight:700;color:var(--ok);white-space:nowrap}
.sec{background:none;border:2px dashed var(--mocha);color:var(--doppio);margin-top:6px;font-weight:700}
button.b{font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--doppio);background:var(--flat);color:var(--doppio);padding:16px 18px;min-height:56px;cursor:pointer;flex:1}
button.b.p{background:var(--doppio);color:var(--flat)}
button.b:disabled{opacity:.45}
.row{display:flex;gap:10px;margin-top:12px}
canvas{width:100%;height:46vh;min-height:230px;max-height:420px;background:#fff;border:2px solid var(--doppio);border-radius:10px;touch-action:none;display:block}
.dica{font-size:14px;margin:6px 0 0;text-align:center}
.centro{text-align:center;padding:40px 10px}
.centro .big{font-size:72px;color:var(--ok);line-height:1}
.erro{color:var(--err);font-weight:700;margin-top:10px;min-height:22px}
.oculto{display:none!important}
h2{margin:0 0 10px;font-size:24px}
</style>
</head>

<main>
  <div id="load" class="centro">Carregando a lista…</div>
  <div id="fatal" class="centro oculto"><h2>Não foi possível abrir</h2><p id="fatalMsg"></p></div>

  <div id="tela-lista" class="oculto">
    <div class="info"><b id="iTrein"></b><span id="iDet"></span><div class="prog"><i id="iProg"></i></div><span id="iCont"></span></div>
    <div id="encerrada" class="oculto centro"><h2>Lista encerrada</h2><p>O instrutor já encerrou esta lista de presença.</p></div>
    <div id="area-nomes">
      <input type="search" id="busca" placeholder="Buscar seu nome…" autocomplete="off">
      <div class="nomes" id="nomes"></div>
      <button class="nome sec" id="outro" type="button">Meu nome não está na lista</button>
    </div>
  </div>

  <div id="tela-outro" class="oculto">
    <h2>Incluir meu nome</h2>
    <input type="text" id="novoNome" placeholder="Nome completo" autocomplete="off" maxlength="80">
    <div class="row"><button class="b" id="outroVoltar" type="button">Voltar</button><button class="b p" id="outroSeguir" type="button">Continuar</button></div>
    <div class="erro" id="outroErro"></div>
  </div>

  <div id="tela-assinar" class="oculto">
    <h2 id="quem"></h2>
    <canvas id="quadro"></canvas>
    <p class="dica">Assine dentro do quadro, com o dedo ou a caneta.</p>
    <div class="row"><button class="b" id="limpar" type="button">Limpar</button><button class="b" id="voltar" type="button">Voltar</button><button class="b p" id="confirmar" type="button" disabled>Confirmar</button></div>
    <div class="erro" id="erroAss"></div>
  </div>

  <div id="tela-ok" class="oculto centro"><div class="big">✔</div><h2>Presença registrada</h2><p id="okNome"></p></div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const ID=new URLSearchParams(location.search).get('s')||'';
let dados=null,alvo=null,extra=false,nomeExtra='',tAuto=null;
const telas=['load','fatal','tela-lista','tela-outro','tela-assinar','tela-ok'];
function ir(t){telas.forEach(x=>$(x).classList.toggle('oculto',x!==t))}
function fatal(m){$('fatalMsg').textContent=m;ir('fatal')}
function fmt(d){if(!d)return'';const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}
async function carregar(manter){
  if(!/^[a-z2-7]{16}$/.test(ID))return fatal('O link está incompleto. Peça ao instrutor para mostrar o QR code novamente.');
  try{
    const r=await fetch('api/sessao?id='+ID+'&t='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(!r.ok)return fatal(j.erro||'Lista não encontrada.');
    dados=j;desenhar();
    if(!manter)ir('tela-lista');
  }catch(e){if(!manter)fatal('Sem conexão com a internet. Verifique e tente de novo.')}
}
function desenhar(){
  const m=dados.meta,p=dados.participantes,feitos=p.filter(x=>x.assinou).length;
  $('iTrein').textContent=m.treinamento||'Treinamento';
  $('iDet').textContent=[fmt(m.data),m.horario,m.local].filter(Boolean).join(' · ');
  $('iCont').textContent=feitos+' de '+p.length+' já assinaram';
  $('iProg').style.width=(p.length?feitos/p.length*100:0)+'%';
  $('encerrada').classList.toggle('oculto',!m.encerrada);
  $('area-nomes').classList.toggle('oculto',!!m.encerrada);
  const q=($('busca').value||'').trim().toLowerCase();
  $('nomes').innerHTML='';
  p.filter(x=>!q||x.nome.toLowerCase().includes(q)).forEach(x=>{
    const b=document.createElement('button');b.type='button';b.className='nome'+(x.assinou?' feito':'');
    b.innerHTML='<span></span><span class="ck"></span>';b.firstChild.textContent=x.nome;
    if(x.assinou){b.lastChild.textContent='✔ assinou';b.disabled=true}
    else b.onclick=()=>comecar(x.id,x.nome,false);
    $('nomes').appendChild(b);
  });
}
$('busca').oninput=desenhar;
function comecar(pid,nome,ex){alvo=pid;extra=ex;nomeExtra=nome;$('quem').textContent=nome;limpar();$('erroAss').textContent='';ir('tela-assinar');ajustar()}
$('outro').onclick=()=>{$('novoNome').value='';$('outroErro').textContent='';ir('tela-outro');$('novoNome').focus()};
$('outroVoltar').onclick=()=>ir('tela-lista');
$('outroSeguir').onclick=()=>{const n=$('novoNome').value.trim().replace(/\s+/g,' ');if(n.split(' ').filter(w=>w.length>=2).length<2){$('outroErro').textContent='Digite nome e sobrenome.';return}comecar(null,n.toUpperCase(),true)};
$('voltar').onclick=()=>{ir(extra?'tela-outro':'tela-lista')};

/* ---- quadro de assinatura ---- */
const cv=$('quadro'),cx=cv.getContext('2d');let tracos=[],atual=null,pontos=0;
function ajustar(){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
  cx.setTransform(d,0,0,d,0,0);cx.lineWidth=3.2;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#111';
  redesenhar();
}
function redesenhar(){
  cx.clearRect(0,0,cv.width,cv.height);
  tracos.forEach(t=>{cx.beginPath();t.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));if(t.length===1)cx.lineTo(t[0].x+.1,t[0].y);cx.stroke()});
}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);atual=[pos(e)];tracos.push(atual);pontos++;redesenhar()});
cv.addEventListener('pointermove',e=>{if(!atual)return;e.preventDefault();(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{atual.push(pos(ev));pontos++});redesenhar();$('confirmar').disabled=pontos<25});
const fim=e=>{if(atual){atual=null;$('confirmar').disabled=pontos<25}};
cv.addEventListener('pointerup',fim);cv.addEventListener('pointercancel',fim);
function limpar(){tracos=[];atual=null;pontos=0;$('confirmar').disabled=true;redesenhar()}
$('limpar').onclick=limpar;
window.addEventListener('resize',()=>{if(!$('tela-assinar').classList.contains('oculto'))ajustar()});
function exportar(){
  // recorta ao tamanho da assinatura (menos bytes e melhor encaixe no PDF)
  const d=window.devicePixelRatio||1;let x0=1e9,y0=1e9,x1=-1,y1=-1;
  tracos.forEach(t=>t.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}));
  const pad=6;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1+=pad;y1+=pad;
  const w=Math.max(10,x1-x0),h=Math.max(10,y1-y0),esc=Math.min(1,520/w);
  const o=document.createElement('canvas');o.width=Math.round(w*esc);o.height=Math.round(h*esc);
  const c=o.getContext('2d');c.scale(esc,esc);c.translate(-x0,-y0);c.lineWidth=3.2;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#111';
  tracos.forEach(t=>{c.beginPath();t.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));if(t.length===1)c.lineTo(t[0].x+.1,t[0].y);c.stroke()});
  return o.toDataURL('image/png');
}
$('confirmar').onclick=async()=>{
  const b=$('confirmar');b.disabled=true;$('erroAss').textContent='';
  try{
    const corpo=extra?{acao:'incluir',id:ID,nome:nomeExtra,img:exportar()}:{acao:'assinar',id:ID,pid:alvo,img:exportar()};
    const r=await fetch('api/sessao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){await carregar(true);ir('tela-lista');return}
    if(!r.ok){$('erroAss').textContent=j.erro||'Não consegui registrar. Tente de novo.';b.disabled=false;return}
    $('okNome').textContent=nomeExtra;ir('tela-ok');
    clearTimeout(tAuto);tAuto=setTimeout(async()=>{await carregar(true);ir('tela-lista')},2200);
  }catch(e){$('erroAss').textContent='Sem conexão. Sua assinatura não foi enviada — tente de novo.';b.disabled=false}
};
// atualiza a lista de tempos em tempos (quem assinou em outro aparelho aparece marcado)
setInterval(()=>{if(!$('tela-lista').classList.contains('oculto')&&!$('busca').value)carregar(true)},15000);
carregar(false);
})();
</script>
</body>
</html>
